<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir PDF Libre - Raloy</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; padding: 30px; color: #334155; }
        .wizard-card { background: white; padding: 30px; border-radius: 8px; max-width: 800px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .step { display: none; }
        .step.active { display: block; }
        h2 { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px;}
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 0.9rem;}
        input[type="file"] { width: 100%; padding: 12px; border: 1px dashed #cbd5e1; border-radius: 4px; box-sizing: border-box; background: #f8fafc; cursor: pointer;}
        .btn { background: #3b82f6; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1rem; width: 100%;}
        .btn:hover { background: #2563eb; }
        .btn-success { background: #10b981; }
        .instruction-box { background: #f8fafc; padding: 15px; border-left: 4px solid #3b82f6; margin-bottom: 20px; border-radius: 0 5px 5px 0;}
    </style>
</head>
<body>

<div class="wizard-card">
    <a href="/portal/mis-pdfs/" style="color:#64748b; text-decoration:none; margin-bottom:15px; display:inline-block;">⬅ Cancelar y volver</a>
    <h2 id="stepTitle">Alta de PDF Libre</h2>

    <div id="step1" class="step active">
        <div class="instruction-box">
            <strong>Instrucciones:</strong>
            <ol style="margin-bottom:0;">
                <li>Selecciona el archivo PDF desde tu computadora.</li>
                <li>El sistema lo subirá automáticamente al repositorio seguro de tu empresa.</li>
            </ol>
        </div>

        <div class="form-group">
            <label>Seleccionar Archivo PDF:</label>
            <input type="file" id="pdfFile" accept="application/pdf" required>
        </div>
        <button class="btn" onclick="subirPdf()">Subir y Conectar ➔</button>
    </div>

    <div id="step2" class="step">
        <div style="text-align: center; margin-bottom: 20px;">
            <span style="font-size: 3rem; color: #10b981;">✅</span>
            <h3 style="color: #10b981; margin-top: 10px;">¡Documento Subido con Éxito!</h3>
            <p>Nombre del archivo: <strong id="docName" style="color:#333;"></strong></p>
        </div>

        <button class="btn btn-success" onclick="alert('En el próximo paso configuraremos las firmas')">SOLICITAR FIRMA</button>
    </div>
</div>

<script>
    function subirPdf() {
        const fileInput = document.getElementById('pdfFile');
        if(fileInput.files.length === 0) return alert("Por favor selecciona un archivo PDF.");

        const file = fileInput.files[0];
        if(file.type !== "application/pdf") return alert("Solo se permiten archivos en formato PDF.");

        const btn = event.target;
        btn.disabled = true; btn.innerText = "Subiendo archivo a Drive de forma segura...";

        const formData = new FormData();
        formData.append('pdf_file', file);

        fetch('/api/subir-pdf-usuario/', {
            method: 'POST',
            body: formData // Enviamos multipart/form-data real
        }).then(r => r.json()).then(res => {
            if(res.status === 'success') {
                document.getElementById('docName').innerText = res.nombre;
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step2').classList.add('active');
            } else {
                alert(res.error);
                btn.disabled = false; btn.innerText = "Subir y Conectar ➔";
            }
        }).catch(err => {
            alert("Error de red.");
            btn.disabled = false; btn.innerText = "Subir y Conectar ➔";
        });
    }
</script>
</body>
</html>
