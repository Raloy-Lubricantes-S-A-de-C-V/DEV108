<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar PIN - Raloy</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #0056b3; margin-top: 0; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; text-align: center; font-size: 1.2rem; letter-spacing: 3px; }
        .btn-submit { background-color: #28a745; color: white; padding: 12px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1rem; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Restablecer PIN</h2>
    <p style="color: #666; font-size: 0.9rem;">Por tu seguridad, ingresa un nuevo PIN. Recuerda no usar datos bancarios.</p>

    <form method="POST" onsubmit="return validarPines()">
        {% csrf_token %}

        <div class="form-group">
            <label>Nuevo PIN:</label>
            <input type="password" id="pin1" name="nuevo_pin" required maxlength="6" placeholder="****">
        </div>

        <div class="form-group">
            <label>Confirmar Nuevo PIN:</label>
            <input type="password" id="pin2" required maxlength="6" placeholder="****">
        </div>

        <button type="submit" class="btn-submit">Guardar Nuevo PIN</button>
    </form>
</div>

<script>
    function validarPines() {
        const pin1 = document.getElementById('pin1').value;
        const pin2 = document.getElementById('pin2').value;
        if (pin1 !== pin2) {
            alert("Los PINs no coinciden.");
            return false;
        }
        return true;
    }
</script>
</body>
</html>
